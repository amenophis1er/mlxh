name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Unit tests touch no MLX code, so they run anywhere, fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the non-MLX runtime dependencies needed by the unit suite.
      # MLX itself is Apple-Silicon-only and is exercised by the macOS job.
      - run: pip install pytest 'prompt-toolkit>=3.0,<4' 'rich>=13,<15' 'fastapi>=0.110' 'httpx>=0.27,<1' 'pillow>=10.0' 'python-multipart>=0.0.20,<1' 'huggingface_hub>=0.30'
      # Install the package itself for dist-info lookups and subprocess workers,
      # but skip its Apple-Silicon-only MLX dependencies on Linux.
      - run: pip install --no-deps .
      - run: pytest -q

  package:
    # Real dependency resolution + imports on Apple Silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: uv pip install -p .venv/bin/python . pytest
      - run: .venv/bin/python -c "import mlxh.cli, mlxh.loader, mlxh.toolcalls, mlxh.serve_app, mlxh.chat_cli"
      - run: .venv/bin/python -m pytest -q
